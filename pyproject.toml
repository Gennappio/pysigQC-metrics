[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysigqc-metrics"
version = "0.1.0"
description = "Isolated radar-metrics pipeline extracted from pysigQC"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
# Single-cell inputs: AnnData in memory, backed H5AD, Zarr, dask-lazy.
anndata = ["anndata>=0.11", "h5py>=3.8", "zarr>=2.18", "dask>=2024.1", "xarray>=2024.1"]
bench = ["pysigqc-metrics[anndata,plot]", "psutil>=5.9"]
all = ["pysigqc-metrics[plot]"]
dev = [
    "pysigqc-metrics[all,anndata]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["pysigqc_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
